name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dyyyydyyy/rest-api-transport-firm

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: transport
          POSTGRES_PASSWORD: transport
          POSTGRES_DB: transport_firm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U transport" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://transport:transport@127.0.0.1:5432/transport_firm_test
      TEST_DATABASE_URL: postgresql+psycopg2://transport:transport@127.0.0.1:5432/transport_firm_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: migrations apply and roll back cleanly
        run: |
          alembic upgrade head
          alembic downgrade base
      - run: pytest --cov=app --cov-report=term-missing

  # The whole stack from docker-compose.yml: db -> migrate -> api, then real requests.
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait --wait-timeout 120
      - name: smoke test
        run: |
          curl -fsS localhost:8000/health/ready
          curl -fsS -X POST localhost:8000/clients -H 'content-type: application/json' \
            -d '{"name": "CI Client", "phone": "+380441234567", "email": "ci@example.com"}'
          test "$(curl -fsS localhost:8000/clients | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" = 1
      - name: logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v

  image:
    needs: [lint, test, compose]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t "$IMAGE:${GITHUB_SHA::7}" .
      - name: image runs as non-root
        run: test "$(docker run --rm "$IMAGE:${GITHUB_SHA::7}" id -u)" = "10001"
      - name: Trivy scan (fail on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image \
            --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$IMAGE:${GITHUB_SHA::7}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet "$IMAGE:${GITHUB_SHA::7}"
      - name: push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${GITHUB_SHA::7}" "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
